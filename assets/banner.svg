    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><text x="56" y="56.6" fill="#65a30d" font-size="15" font-weight="700" letter-spacing=".6">Wilson's Lawn Maintenance</text><text x="56" y="122.2" fill="#ecfccb" font-size="60" font-weight="700" letter-spacing="-.5">.github</text><text x="56" y="166.0" fill="#cfdeb2" font-size="23">The profile, the welcome, and the defaults every</text><text x="56" y="196.8" fill="#cfdeb2" font-size="23">repository shares.</text></g>
  </g>
</svg>
