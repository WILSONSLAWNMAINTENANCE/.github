    <path class="arrive" style="animation-delay:0.30s" d="M1096.4 188.5A142 142 0 0 1 1100.0 217.4" fill="none" stroke="#3c6013" stroke-width="28"/>
    <circle class="halo" cx="958.0" cy="78.0" r="22" fill="none" stroke="#afd476" stroke-width="2"/>
    <circle cx="1003.8" cy="198.8" r="2.2" fill="#afd476" opacity=".7"/>
    <circle cx="1011.0" cy="128.8" r="2.6" fill="#afd476" opacity=".7"/>
