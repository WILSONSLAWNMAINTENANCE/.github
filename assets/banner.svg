    <path class="arrive" style="animation-delay:1.98s" d="M943.4 78.8A142 142 0 0 1 972.6 78.8" fill="none" stroke="#afd476" stroke-width="34"/>
    <path class="arrive" style="animation-delay:1.70s" d="M977.6 79.4A142 142 0 0 1 1005.9 86.3" fill="none" stroke="#5e980e" stroke-width="28"/>
    <path class="arrive" style="animation-delay:1.42s" d="M1010.7 88.2A142 142 0 0 1 1036.5 101.7" fill="none" stroke="#578d0f" stroke-width="28"/>
    <path class="arrive" style="animation-delay:1.14s" d="M1040.7 104.6A142 142 0 0 1 1062.6 123.9" fill="none" stroke="#508210" stroke-width="28"/>
    <path class="arrive" style="animation-delay:0.86s" d="M1065.9 127.8A142 142 0 0 1 1082.5 151.8" fill="none" stroke="#4a7611" stroke-width="28"/>
