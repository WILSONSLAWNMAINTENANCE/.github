<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="t d">
  <title id="t">Wilson's Lawn Maintenance on GitHub</title>
  <desc id="d">Lawn care in Glen Rock, PA and York County. A work in progress. The picture: a sun held by an open circle, and 5 waves drawing in beneath it. With reduced motion, the finished picture shows at once.</desc>
  <style>
    /* Motion only for readers who have not asked for less. Outside this block everything is in its finished state. */
    @media (prefers-reduced-motion: no-preference) {
      .draw { stroke-dasharray: 100; animation: draw 2.6s cubic-bezier(.4,0,.2,1) both; }
      .arrive { animation: arrive .5s ease-out both; }
      .breathe { transform-box: fill-box; transform-origin: center; animation: breathe 8s steps(48) 3s infinite; }
      .halo { transform-box: fill-box; transform-origin: center; animation: halo 5s steps(60) 3.6s infinite; }
    }
    @keyframes draw { from { stroke-dashoffset: 100 } to { stroke-dashoffset: 0 } }
    @keyframes arrive { from { opacity: 0 } to { opacity: 1 } }
    @keyframes breathe { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.07) } }
    @keyframes halo { 0% { opacity: .55; transform: scale(1) } 70%, 100% { opacity: 0; transform: scale(2.1) } }
    .halo { opacity: 0 }
  </style>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b2918"/><stop offset="1" stop-color="#101919"/></linearGradient>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="668" y1="0" x2="1160" y2="0"><stop offset="0.00" stop-color="#4d7c0f"/><stop offset="0.50" stop-color="#65a30d"/><stop offset="1.00" stop-color="#afd476"/></linearGradient>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="620" y1="0" x2="1200" y2="0"><stop offset="0" stop-color="#65a30d" stop-opacity="0"/><stop offset=".35" stop-color="#65a30d"/><stop offset="1" stop-color="#afd476"/></linearGradient>
    <clipPath id="card"><rect width="1200" height="260" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <!-- an opaque ground: the same picture on GitHub's light and dark themes -->
    <rect width="1200" height="260" fill="url(#ground)"/>
    <circle class="breathe" cx="965.5" cy="104.2" r="46" fill="url(#line)"/>
    <path class="draw" pathLength="100" d="M1014.2 59.6A66 66 0 1 1 951.3 39.7" fill="none" stroke="#65a30d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:0.20s"/>
    <path class="draw" pathLength="100" d="M620 164.0Q689.2 174.8 758.4 164.0Q827.6 153.2 896.9 164.0Q966.1 174.8 1035.3 164.0Q1104.5 153.2 1173.7 164.0Q1242.9 174.8 1312.2 164.0" fill="none" stroke="url(#fade)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:0.40s"/>
    <path class="draw" pathLength="100" d="M620 178.5Q681.2 161.3 742.5 178.5Q803.7 195.7 864.9 178.5Q926.2 161.3 987.4 178.5Q1048.6 195.7 1109.8 178.5Q1171.1 161.3 1232.3 178.5Q1293.5 195.7 1354.8 178.5" fill="none" stroke="url(#fade)" stroke-width="2.8000000000000003" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:0.90s"/>
    <path class="draw" pathLength="100" d="M620 193.0Q675.2 210.0 730.3 193.0Q785.5 176.0 840.7 193.0Q895.9 210.0 951.0 193.0Q1006.2 176.0 1061.4 193.0Q1116.6 210.0 1171.7 193.0Q1226.9 176.0 1282.1 193.0" fill="none" stroke="url(#fade)" stroke-width="2.4000000000000004" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:1.40s"/>
    <path class="draw" pathLength="100" d="M620 207.5Q693.9 222.5 767.8 207.5Q841.7 192.5 915.7 207.5Q989.6 222.5 1063.5 207.5Q1137.4 192.5 1211.3 207.5Q1285.2 222.5 1359.1 207.5" fill="none" stroke="url(#fade)" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:1.90s"/>
    <path class="draw" pathLength="100" d="M620 222.0Q698.9 211.2 777.8 222.0Q856.8 232.8 935.7 222.0Q1014.6 211.2 1093.5 222.0Q1172.4 232.8 1251.4 222.0" fill="none" stroke="url(#fade)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:2.40s"/>
    <rect x="0.0" y="248" width="300.5" height="12" fill="#365314"/><rect x="300.0" y="248" width="300.5" height="12" fill="#4d7c0f"/><rect x="600.0" y="248" width="300.5" height="12" fill="#65a30d"/><rect x="900.0" y="248" width="300.5" height="12" fill="#ecfccb"/>
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><text x="56" y="38.7" fill="#65a30d" font-size="15" font-weight="700" letter-spacing=".6">Keeping it green</text><text x="56" y="90.8" fill="#ecfccb" font-size="46" font-weight="700" letter-spacing="-.5">Wilson's Lawn</text><text x="56" y="142.3" fill="#ecfccb" font-size="46" font-weight="700" letter-spacing="-.5">Maintenance on GitHub</text><text x="56" y="183.9" fill="#cfdeb2" font-size="23">Lawn care in Glen Rock, PA and York County. A</text><text x="56" y="214.7" fill="#cfdeb2" font-size="23">work in progress.</text></g>
  </g>
</svg>
